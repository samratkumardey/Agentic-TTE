[project]
name = "agentic-tte"
version = "0.1.0"
description = "Open-weight multi-agent Target Trial Emulation: replay, rehearse and redesign clinical trials on real-world data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samrat Kumar Dey" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lifelines>=0.29",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
agentic-tte = "agentic_tte.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_tte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs network access and/or a running Ollama server (deselected by default)",
    "slow: statistical recovery on synthetic data, about 2 minutes (runs by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
